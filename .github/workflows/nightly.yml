name: Nightly health

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn health:invariants
      - run: yarn health:dead-code
      - run: yarn health:coverage
      - name: Run performance health with timing report
        run: |
          mkdir -p artifacts
          yarn ci:timed-performance
      - name: Run balance health with timing report
        run: |
          mkdir -p artifacts
          yarn ci:timed-balance
      - name: Run archetype balance health with timing report
        run: |
          mkdir -p artifacts
          yarn ci:timed-balance-archetypes
      - run: yarn health:duplication
      - name: Upload nightly timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-health-timing-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
