name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - name: Run tests with timing report
        run: |
          mkdir -p artifacts
          yarn ci:timed-tests
      - name: Upload test timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing-${{ github.run_id }}
          path: artifacts/test-timing.json
          if-no-files-found: warn
          retention-days: 14

  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn health:invariants
      - name: Run performance health with timing report
        run: |
          mkdir -p artifacts
          yarn ci:timed-performance
      - name: Run balance health with timing report
        run: |
          mkdir -p artifacts
          yarn ci:timed-balance
      - run: yarn health:documentation
      - run: yarn health:dead-code
      - run: yarn health:duplication
      - name: Upload health timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-timing-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
        env:
          CI: true
